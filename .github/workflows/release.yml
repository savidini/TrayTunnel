name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'savidini/VpnCliTray'
    name: Test and publish release
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify release tag is on main
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          & git rev-parse --verify --quiet 'origin/main^{commit}' | Out-Null
          if ($LASTEXITCODE -ne 0) {
              throw 'The protected release branch origin/main was not found.'
          }

          $tagCommitOutput = @(& git rev-parse "$env:GITHUB_REF_NAME^{commit}")
          $tagCommitExitCode = $LASTEXITCODE
          $tagCommit = ($tagCommitOutput -join '').Trim()
          if ($tagCommitExitCode -ne 0 -or [string]::IsNullOrWhiteSpace($tagCommit)) {
              throw "Could not resolve release tag '$env:GITHUB_REF_NAME' to a commit."
          }

          & git merge-base --is-ancestor $tagCommit 'origin/main'
          if ($LASTEXITCODE -ne 0) {
              throw "Release tag '$env:GITHUB_REF_NAME' does not point to a commit on origin/main."
          }

      - name: Run application offline tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $windowsPowerShell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $windowsPowerShell `
              -NoLogo `
              -NoProfile `
              -NonInteractive `
              -ExecutionPolicy Bypass `
              -File '.\tests\Invoke-Tests.ps1'
          if ($LASTEXITCODE -ne 0) {
              throw "Application offline tests failed with exit code $LASTEXITCODE."
          }

      - name: Run manager offline tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $windowsPowerShell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $windowsPowerShell `
              -NoLogo `
              -NoProfile `
              -NonInteractive `
              -ExecutionPolicy Bypass `
              -File '.\tests\Invoke-ManagerTests.ps1'
          if ($LASTEXITCODE -ne 0) {
              throw "Manager offline tests failed with exit code $LASTEXITCODE."
          }

      - name: Verify version and stage release assets
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $applicationSource = Join-Path $env:GITHUB_WORKSPACE 'VpnCliTray.ps1'
          $managerSource = Join-Path $env:GITHUB_WORKSPACE 'Manage-VpnCliTray.ps1'
          foreach ($sourcePath in @($applicationSource, $managerSource)) {
              if (-not (Test-Path -LiteralPath $sourcePath -PathType Leaf)) {
                  throw "Required release asset was not found: $sourcePath"
              }
          }

          . $managerSource
          $version = Get-ScriptVersion -Path $applicationSource
          $stableSemVerPattern = '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ($version -cnotmatch $stableSemVerPattern) {
              throw "Application version '$version' is not a stable SemVer version."
          }

          $expectedTag = 'v' + $version
          if ($env:GITHUB_REF_NAME -cne $expectedTag) {
              throw "Tag '$env:GITHUB_REF_NAME' does not match application version '$version' (expected '$expectedTag')."
          }

          $releaseDirectory = Join-Path $env:RUNNER_TEMP (
              'VpnCliTray-release-' + [Guid]::NewGuid().ToString('N')
          )
          [void](New-Item -ItemType Directory -Path $releaseDirectory)

          $applicationAsset = Join-Path $releaseDirectory 'VpnCliTray.ps1'
          $managerAsset = Join-Path $releaseDirectory 'Manage-VpnCliTray.ps1'
          Copy-Item -LiteralPath $applicationSource -Destination $applicationAsset
          Copy-Item -LiteralPath $managerSource -Destination $managerAsset

          $applicationFile = Get-Item -LiteralPath $applicationAsset
          $applicationHash = (Get-FileHash -LiteralPath $applicationAsset -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
              schemaVersion = 1
              product       = 'VpnCliTray'
              version       = $version
              asset         = [ordered]@{
                  name   = 'VpnCliTray.ps1'
                  sha256 = $applicationHash
                  size   = [long]$applicationFile.Length
              }
          }

          $utf8NoBom = New-Object Text.UTF8Encoding($false)
          $manifestPath = Join-Path $releaseDirectory 'VpnCliTray.release.json'
          $manifestJson = $manifest | ConvertTo-Json -Depth 3
          [IO.File]::WriteAllText(
              $manifestPath,
              $manifestJson + [Environment]::NewLine,
              $utf8NoBom
          )
          [IO.File]::AppendAllText(
              $env:GITHUB_ENV,
              "RELEASE_DIRECTORY=$releaseDirectory`nRELEASE_VERSION=$version`n",
              $utf8NoBom
          )

      - name: Create and publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME

          $existingReleaseOutput = @(
              & gh release view $tag --json tagName,isDraft 2>$null
          )
          $existingReleaseExitCode = $LASTEXITCODE
          if ($existingReleaseExitCode -eq 0) {
              $existingRelease = ($existingReleaseOutput -join [Environment]::NewLine) | ConvertFrom-Json
              if ($existingRelease.tagName -cne $tag) {
                  throw "The existing release resolved to unexpected tag '$($existingRelease.tagName)'."
              }
              if (-not [bool]$existingRelease.isDraft) {
                  throw "A published release already exists for $tag; refusing to replace its assets."
              }
              Write-Host "Reusing existing draft release for $tag."
          }
          else {
              & gh release create $tag `
                  --draft `
                  --verify-tag `
                  --generate-notes `
                  --title "VPN CLI Tray $tag"
              if ($LASTEXITCODE -ne 0) {
                  throw "Could not create draft release for $tag."
              }
          }

          $assets = @(
              (Join-Path $env:RELEASE_DIRECTORY 'VpnCliTray.ps1')
              (Join-Path $env:RELEASE_DIRECTORY 'Manage-VpnCliTray.ps1')
              (Join-Path $env:RELEASE_DIRECTORY 'VpnCliTray.release.json')
          )
          $expectedAssetHashes = @{}
          foreach ($assetPath in $assets) {
              $assetName = [IO.Path]::GetFileName($assetPath)
              $expectedAssetHashes[$assetName] = (
                  Get-FileHash -LiteralPath $assetPath -Algorithm SHA256
              ).Hash.ToUpperInvariant()
          }

          & gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) {
              throw "Could not upload release assets for $tag. The draft release was left unpublished."
          }

          $releaseStateOutput = @(
              & gh release view $tag --json tagName,isDraft,assets
          )
          if ($LASTEXITCODE -ne 0) {
              throw "Could not verify uploaded assets for $tag. The draft release was left unpublished."
          }
          $releaseState = ($releaseStateOutput -join [Environment]::NewLine) | ConvertFrom-Json
          if ($releaseState.tagName -cne $tag -or -not [bool]$releaseState.isDraft) {
              throw "Release $tag was not the expected draft after asset upload."
          }
          if (@($releaseState.assets).Count -ne $assets.Count) {
              throw "Release $tag does not contain exactly the expected assets. The draft release was left unpublished."
          }
          foreach ($assetPath in $assets) {
              $assetName = [IO.Path]::GetFileName($assetPath)
              $remoteAsset = @($releaseState.assets | Where-Object { $_.name -ceq $assetName })
              if ($remoteAsset.Count -ne 1) {
                  throw "Release $tag does not contain exactly one '$assetName' asset. The draft release was left unpublished."
              }
              $expectedSize = [long](Get-Item -LiteralPath $assetPath).Length
              if ([long]$remoteAsset[0].size -ne $expectedSize) {
                  throw "Release asset '$assetName' has an unexpected size. The draft release was left unpublished."
              }
          }

          $verificationDirectory = Join-Path $env:RUNNER_TEMP (
              'VpnCliTray-release-verification-' + [Guid]::NewGuid().ToString('N')
          )
          [void](New-Item -ItemType Directory -Path $verificationDirectory)
          try {
              & gh release download $tag --dir $verificationDirectory
              if ($LASTEXITCODE -ne 0) {
                  throw "Could not download uploaded assets for $tag. The draft release was left unpublished."
              }

              $downloadedFiles = @(
                  Get-ChildItem -LiteralPath $verificationDirectory -File -Force
              )
              if ($downloadedFiles.Count -ne $assets.Count) {
                  throw "Downloaded release $tag does not contain exactly the expected assets. The draft release was left unpublished."
              }

              foreach ($assetPath in $assets) {
                  $assetName = [IO.Path]::GetFileName($assetPath)
                  $downloadedAssetPath = Join-Path $verificationDirectory $assetName
                  if (-not (Test-Path -LiteralPath $downloadedAssetPath -PathType Leaf)) {
                      throw "Uploaded release asset '$assetName' could not be downloaded. The draft release was left unpublished."
                  }

                  $downloadedHash = (
                      Get-FileHash -LiteralPath $downloadedAssetPath -Algorithm SHA256
                  ).Hash.ToUpperInvariant()
                  if ($downloadedHash -cne [string]$expectedAssetHashes[$assetName]) {
                      throw "Uploaded release asset '$assetName' failed SHA-256 verification. The draft release was left unpublished."
                  }
              }
          }
          finally {
              if (Test-Path -LiteralPath $verificationDirectory -PathType Container) {
                  Remove-Item -LiteralPath $verificationDirectory -Recurse -Force -ErrorAction SilentlyContinue
              }
          }

          function Compare-StableSemVer {
              param(
                  [Parameter(Mandatory = $true)]
                  [string]$Left,

                  [Parameter(Mandatory = $true)]
                  [string]$Right
              )

              $leftParts = $Left.Split('.')
              $rightParts = $Right.Split('.')
              for ($index = 0; $index -lt 3; $index++) {
                  $leftPart = [Numerics.BigInteger]::Parse(
                      $leftParts[$index],
                      [Globalization.CultureInfo]::InvariantCulture
                  )
                  $rightPart = [Numerics.BigInteger]::Parse(
                      $rightParts[$index],
                      [Globalization.CultureInfo]::InvariantCulture
                  )
                  if ($leftPart -lt $rightPart) { return -1 }
                  if ($leftPart -gt $rightPart) { return 1 }
              }
              return 0
          }

          $markLatest = $true
          $latestReleaseOutput = @(
              & gh release view --json tagName,isDraft,isPrerelease 2>$null
          )
          $latestReleaseExitCode = $LASTEXITCODE
          if ($latestReleaseExitCode -eq 0) {
              $latestRelease = ($latestReleaseOutput -join [Environment]::NewLine) | ConvertFrom-Json
              if ([bool]$latestRelease.isDraft -or [bool]$latestRelease.isPrerelease) {
                  throw 'GitHub returned a draft or prerelease as the latest published stable release.'
              }

              $stableTagPattern = '^v(?<Version>(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$'
              $latestTagMatch = [regex]::Match([string]$latestRelease.tagName, $stableTagPattern)
              if (-not $latestTagMatch.Success) {
                  throw "Latest published release tag '$($latestRelease.tagName)' is not stable SemVer."
              }
              $latestVersion = $latestTagMatch.Groups['Version'].Value
              $markLatest = (Compare-StableSemVer -Left $env:RELEASE_VERSION -Right $latestVersion) -gt 0
          }
          else {
              $releaseInventoryOutput = @(
                  & gh release list --limit 1000 --json tagName,isDraft,isPrerelease 2>$null
              )
              if ($LASTEXITCODE -ne 0) {
                  throw 'Could not determine whether a latest published release already exists.'
              }
              $releaseInventory = @(
                  ($releaseInventoryOutput -join [Environment]::NewLine) | ConvertFrom-Json
              )
              $publishedStableReleases = @(
                  $releaseInventory | Where-Object {
                      -not [bool]$_.isDraft -and -not [bool]$_.isPrerelease
                  }
              )
              if ($publishedStableReleases.Count -gt 0) {
                  throw 'Published stable releases exist, but the latest release could not be resolved safely.'
              }
          }

          $latestArgument = if ($markLatest) { '--latest' } else { '--latest=false' }
          & gh release edit $tag --draft=false $latestArgument
          if ($LASTEXITCODE -ne 0) {
              throw "Assets were uploaded, but the draft release for $tag could not be published."
          }
